# ============================================================
# RailwayOS — pyproject.toml
# ============================================================
# Tool configuration for the backend Python project.
# Dependency management moves here fully in Day 4.
# Added: Day 002 — project structure scaffolding
# ============================================================

[project]
name = "railwayos-backend"
version = "0.1.0"
description = "RailwayOS — FastAPI backend for railway operations platform"
requires-python = ">=3.11"
authors = [
    { name = "RailwayOS Team" }
]
readme = "README.md"
license = { text = "MIT" }

# Core dependencies will be pinned in Day 4
# Full list in requirements.txt
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

# ── Ruff (linter + formatter) ────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── MyPy (type checker) ──────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ── Build system ─────────────────────────────────────────────
[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends.legacy:build"
