# ============================================================
# RailwayOS — pyproject.toml
# ============================================================
# Tool configuration for the backend Python project.
# Dependency management moves here fully in Day 4.
# Added: Day 002 — project structure scaffolding
# ============================================================

[project]
name = "railwayos-backend"
version = "0.1.0"
description = "RailwayOS — FastAPI backend for railway operations platform"
requires-python = ">=3.11"
authors = [
    { name = "RailwayOS Team" }
]
readme = "README.md"
license = { text = "MIT" }

# Installation pins live in requirements.txt and requirements-dev.txt.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "redis==5.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart==0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

# ── Ruff (linter + formatter) ────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── MyPy (type checker) ──────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ── Build system ─────────────────────────────────────────────
[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
