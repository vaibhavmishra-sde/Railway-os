# ============================================================
# RailwayOS — docker-compose.yml
# ============================================================
# PURPOSE: Defines and orchestrates all local development
# services in one command: docker-compose up
#
# SERVICES:
#   - postgres   : Primary database
#   - redis      : Cache and pub/sub
#   - backend    : FastAPI application (added Phase 5)
#   - frontend   : React application (added Phase 7)
#
# CURRENT STATE: Phase 1 — Database and Redis services only.
# Backend and frontend containers will be added in their
# respective phases.
#
# USAGE:
#   docker-compose up -d            Start all services
#   docker-compose down             Stop all services
#   docker-compose logs -f backend  Follow backend logs
#   docker-compose ps               Show service status
# ============================================================

version: "3.9"

services:

  # ─────────────────────────────────────────
  # PostgreSQL — Primary Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    # Why alpine? Smaller image size (~80MB vs ~400MB)
    # Same functionality for development purposes.
    container_name: railwayos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railwayos_db}
      POSTGRES_USER: ${POSTGRES_USER:-railwayos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
      # Left side = your machine port
      # Right side = port inside the container
      # You connect with: localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Named volume persists data between docker-compose down/up
      # Without this, your database resets every time
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railwayos_user} -d ${POSTGRES_DB:-railwayos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Other services can use "depends_on: postgres: condition: service_healthy"
      # to wait until Postgres is ACTUALLY ready (not just started)

  # ─────────────────────────────────────────
  # Redis — Cache & Pub/Sub
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: railwayos_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --appendfsync everysec
    # --requirepass   : Require password authentication
    # --appendonly yes: Enable AOF persistence (survives restart)
    # --appendfsync   : Sync to disk every second (balance of safety/performance)
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Backend — FastAPI (Added in Phase 5)
  # ─────────────────────────────────────────
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: railwayos_backend
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app   # Hot reload during development

  # ─────────────────────────────────────────
  # Frontend — React + Vite (Added in Phase 7)
  # ─────────────────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: railwayos_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules   # Anonymous volume keeps container node_modules


# ─────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────
# Named volumes persist data even when containers are removed.
# docker-compose down       → containers removed, volumes kept
# docker-compose down -v    → containers AND volumes removed
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local


# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
# By default, all services in a docker-compose file share
# a single network and can reach each other by service name.
# e.g., backend connects to postgres with host "postgres"
# We'll add explicit network config in Phase 22.
